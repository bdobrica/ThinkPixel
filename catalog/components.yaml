schema_version: "1"

platform:
  id: thinkpixel
  repository: bdobrica/ThinkPixel
  status: pre-1.0
  production_qualified: false

maturity_model:
  - design
  - contract
  - implementation
  - integration
  - rc
  - qualified

components:
  - id: ag
    name: ThinkPixelAG
    repository: bdobrica/ThinkPixelAG
    platform_area: governance
    maturity: rc

    role: >-
      Agent governance and lifecycle control plane for governed Run authority,
      policy decisions, approvals, revocation, and resource envelopes.

    owns:
      - run_authority
      - governance_state
      - policy_decisions
      - approvals
      - revocation
      - resource_envelopes

    does_not_own:
      - agent_execution
      - model_provider_credentials
      - downstream_tool_credentials

  - id: ar
    name: ThinkPixelAR
    repository: bdobrica/ThinkPixelAR
    platform_area: runtime
    maturity: implementation

    role: >-
      Agent runtime for durable Sessions, disposable isolated execution,
      harness adaptation, recovery, and runtime events.

    owns:
      - session_lifecycle
      - execution_lifecycle
      - harness_adaptation
      - runtime_events
      - sandbox_supervision
      - execution_recovery

    does_not_own:
      - durable_governance_authority
      - model_provider_credentials
      - downstream_tool_credentials

  - id: ws
    name: ThinkPixelWS
    repository: bdobrica/ThinkPixelWS
    platform_area: workspace
    maturity: contract

    role: >-
      Durable roaming Workspaces with persistent work context, immutable
      generations, materializations, snapshots, forks, and source provenance.

    owns:
      - workspace_identity
      - durable_work_context
      - workspace_generations
      - workspace_snapshots
      - source_provenance

  - id: mem
    name: ThinkPixelMEM
    repository: bdobrica/ThinkPixelMEM
    platform_area: memory
    maturity: contract

    role: >-
      Governed long-term agent memory with provenance, temporal revisions,
      retrieval, correction, and forgetting.

    owns:
      - memory_records
      - memory_provenance
      - memory_revision
      - governed_retrieval
      - correction_and_forgetting

    does_not_own:
      - run_authority

  - id: mp
    name: ThinkPixelMP
    repository: bdobrica/ThinkPixelMP
    platform_area: software_supply_chain
    maturity: implementation

    role: >-
      Marketplace and software supply-chain plane for Skills, runtimes,
      MCP servers, agent bundles, and other immutable artifacts.

    owns:
      - artifact_metadata
      - artifact_identity
      - artifact_qualification
      - artifact_resolution

  - id: tg
    name: ThinkPixelTG
    repository: bdobrica/ThinkPixelTG
    platform_area: tool_access
    maturity: implementation

    role: >-
      Tool gateway and enforcement point for governed tool calls, downstream
      credentials, side effects, idempotency, and evidence.

    owns:
      - tool_invocation_boundary
      - downstream_tool_credentials
      - side_effect_enforcement
      - tool_idempotency
      - tool_execution_evidence

    does_not_own:
      - originating_agent_authority

  - id: llmgw
    name: ThinkPixelLLMGW
    repository: bdobrica/ThinkPixelLLMGW
    platform_area: model_access
    maturity: rc

    role: >-
      LLM gateway for provider abstraction, model routing, credentials,
      budgets, accounting, and model-access policy.

    owns:
      - provider_credentials
      - model_routing
      - model_access_boundary
      - usage_accounting
      - model_budgets

    does_not_own:
      - agent_run_authority

  - id: gr
    name: ThinkPixelGR
    repository: bdobrica/ThinkPixelGR
    platform_area: guardrails
    maturity: implementation

    role: >-
      Guardrail evaluator for model, tool, retrieval, and ingestion content,
      returning findings and decisions for callers to enforce.

    owns:
      - content_evaluation
      - guardrail_findings
      - evaluation_decisions

    does_not_own:
      - caller_enforcement
      - run_authority

  - id: xp
    name: ThinkPixelXP
    repository: bdobrica/ThinkPixelXP
    platform_area: experimentation
    maturity: implementation

    role: >-
      Experimentation and evaluation plane for immutable pipeline variants,
      assignment, exposure and outcome evidence, offline and shadow
      evaluation, controlled experiments, and statistical analysis.

    owns:
      - experiment_definition
      - assignment
      - exposure_evidence
      - outcome_evidence
      - experiment_analysis

adjacent_repositories:
  - id: infra
    name: ThinkPixelInfra
    repository: bdobrica/ThinkPixelInfra

    relationship: >-
      Existing search, retrieval, and RAG implementation. Its future boundary
      with the ThinkPixel agent platform remains intentionally undefined.
